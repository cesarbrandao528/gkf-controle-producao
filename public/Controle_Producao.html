<!doctype html>
<html lang="pt-BR"><head><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"><script src="dados/jszip.min.js"></script><script>try{var t=localStorage.getItem("cp-tema");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Produção • GKF</title>
<style>
:root{--cy:#3d9bff;--cyr:61,155,255;--vi:#a9b6c8;--vir:169,182,200;--am:#fbbf24;--amr:251,191,36;--rd:#ff5d6c;--rdr:255,93,108;--rd2:#ff8a95;--tx:#e8eefb;--tx2:#c3cde2;--mu:#93a3bd;--w:255,255,255;--ln:rgba(255,255,255,.1);--grid:rgba(255,255,255,.08);--bg0:#030813;--opt:#0b1630;--shd:rgba(0,0,0,.4);--bgA:#0b2a55;--bgB:#071530;--bgC:#030813;--card1:rgba(255,255,255,.07);--card2:rgba(255,255,255,.025);--tipbg:rgba(8,16,36,.95);--c3:#7cc4ff;--c4:#5b6f8a;--c5:#2563b0;--c6:#c7d2e0;color-scheme:dark}
:root[data-theme=light]{--cy:#00467D;--cyr:0,70,125;--vi:#6D6E72;--vir:109,110,114;--am:#c48100;--amr:196,129,0;--rd:#c43c3c;--rdr:196,60,60;--rd2:#c43c3c;--tx:#1b2733;--tx2:#3a4a5b;--mu:#5f7083;--w:0,54,95;--ln:rgba(0,54,95,.15);--grid:rgba(0,54,95,.1);--bg0:#fff;--opt:#fff;--shd:rgba(0,54,95,.12);--bgA:#dfeaf5;--bgB:#f0f5fa;--bgC:#f8fafc;--card1:rgba(255,255,255,.95);--card2:rgba(255,255,255,.75);--tipbg:rgba(255,255,255,.97);--c3:#4a90c9;--c4:#9aa7b8;--c5:#0b7bc4;--c6:#b9c4d2;color-scheme:light}
:root{--ac:var(--cy);--cd:rgba(var(--w),.05);--cd2:rgba(var(--w),.08)}
*{box-sizing:border-box}html{background:var(--bg0)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Manrope,"Segoe UI",system-ui,sans-serif;letter-spacing:.01em;line-height:1.5;font-size:14px;background:radial-gradient(900px 500px at 12% -5%,rgba(var(--cyr),.13),transparent 60%),radial-gradient(800px 500px at 95% 5%,rgba(var(--vir),.15),transparent 60%),linear-gradient(165deg,var(--bgA) 0%,var(--bgB) 50%,var(--bgC) 100%);background-attachment:fixed}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between;padding:14px 26px;background:linear-gradient(180deg,rgba(var(--w),.07),rgba(var(--w),.03));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.logo{height:46px;background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 8px 24px var(--shd)}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.brand small{display:block;margin-top:4px;color:var(--mu);font-size:12.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
main{max-width:1500px;margin:auto;padding:26px 26px 60px}
button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(100deg,var(--cy),#1e6fd0);border:1px solid transparent;border-radius:12px;padding:10px 16px;cursor:pointer;transition:filter .2s,border-color .2s,transform .2s}
button:hover{filter:brightness(1.1)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}
button.g,button.t{color:var(--tx);background:rgba(var(--w),.07);border:1px solid var(--ln)}button.g:hover,button.t:hover{border-color:var(--cy);filter:none}
button.t.on{color:#fff;background:linear-gradient(100deg,var(--cy),#1e6fd0);border-color:transparent}
input,select{font:inherit;font-size:13px;color:var(--tx);background:rgba(var(--w),.06);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;backdrop-filter:blur(10px)}
select option{background:var(--opt)}input:hover,select:hover{border-color:rgba(var(--cyr),.5)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--card1),var(--card2));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(var(--w),.12),0 20px 50px var(--shd);min-width:0;transition:border-color .25s,box-shadow .25s}
.card:hover{border-color:rgba(var(--cyr),.35)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu);font-weight:500}label .row{text-transform:none}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid rgba(var(--w),.06);text-align:left;white-space:nowrap}
th{color:var(--mu);font-size:12px;font-weight:700;border-bottom:1px solid var(--ln)}td.r,th.r{text-align:right}
tbody tr:hover td{background:rgba(var(--cyr),.06)}td input,td select{width:100%;min-width:90px;background:transparent;border-color:transparent;padding:7px 9px}td input:hover,td select:hover{border-color:var(--ln)}td input:focus,td select:focus{background:rgba(var(--w),.06);border-color:var(--cy)}
input.r{text-align:right}tr.o td{opacity:.4}tfoot td{font-weight:800;border-top:2px solid var(--ln);border-bottom:0}
.card.k{display:flex;flex-wrap:wrap;gap:16px;background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none}
.k div{flex:1;min-width:220px;background:linear-gradient(180deg,var(--card1),var(--card2));backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:20px;padding:20px 22px;font-size:13px;color:var(--mu);box-shadow:inset 0 1px 0 rgba(var(--w),.12),0 20px 50px var(--shd)}
.k b{display:block;font-size:clamp(22px,2.3vw,30px);font-weight:800;letter-spacing:-.02em;margin-top:8px;background:linear-gradient(100deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.neg{color:var(--rd2)}.mu{color:var(--mu)}h3{font-size:17px;font-weight:700;margin:0 0 6px}
details.eqd summary{cursor:pointer;list-style:none;padding:7px 10px;border:1px solid transparent;border-radius:10px;min-width:150px}details.eqd summary:hover{border-color:var(--ln)}details.eqd[open] summary{background:rgba(var(--w),.06);border-color:var(--cy)}
.eqm{display:grid;gap:6px;margin:6px 0 4px;padding:8px}.ck{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--tx)}.ck input{width:auto;min-width:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--tipbg);border:1px solid var(--cy);border-radius:12px;padding:12px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){header{padding:12px 14px}main{padding:16px 14px}}
</style></head><body>

const Motor=(()=>{
const colN=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n},colL=n=>{let s='';while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
class Er{constructor(c){this.c=c}}
const TK=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?)|"((?:[^"]|"")*)"|([A-Z][A-Z0-9.]*)(?=\()|(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)|(<>|<=|>=|[-+*\/^&=<>(),%])|(TRUE|FALSE))/gy;
function parse(src){
 const t=[];TK.lastIndex=0;let m;
 while(TK.lastIndex<src.length&&(m=TK.exec(src))){
  if(m[1]!==undefined)t.push(['n',+m[1]]);else if(m[2]!==undefined)t.push(['s',m[2].replace(/""/g,'"')]);
  else if(m[3]!==undefined)t.push(['f',m[3]]);else if(m[4]!==undefined)t.push(['r',m[4]]);
  else if(m[5]!==undefined)t.push(['o',m[5]]);else t.push(['b',m[6]==='TRUE'])}
 if(TK.lastIndex<src.trim().length)throw new Error('fórmula não suportada: '+src);
 let p=0;const pk=()=>t[p],nx=()=>t[p++],isO=o=>t[p]&&t[p][0]==='o'&&t[p][1]===o;
 const ref=s=>{const q=s.replace(/\$/g,'').split(':'),a=/([A-Z]+)(\d+)/.exec(q[0]),b=q[1]?/([A-Z]+)(\d+)/.exec(q[1]):a;
  return q[1]?['g',colN(a[1]),+a[2],colN(b[1]),+b[2]]:['c',colN(a[1]),+a[2]]};
 function cmp(){let l=cat();while(t[p]&&t[p][0]==='o'&&['=','<>','<','>','<=','>='].includes(t[p][1])){const o=nx()[1];l=['B',o,l,cat()]}return l}
 function cat(){let l=add();while(isO('&')){nx();l=['B','&',l,add()]}return l}
 function add(){let l=mul();while(isO('+')||isO('-')){const o=nx()[1];l=['B',o,l,mul()]}return l}
 function mul(){let l=pow();while(isO('*')||isO('/')){const o=nx()[1];l=['B',o,l,pow()]}return l}
 function pow(){let l=un();while(isO('^')){nx();l=['B','^',l,un()]}return l}
 function un(){if(isO('-')){nx();return['u',un()]}if(isO('+')){nx();return un()}return pc()}
 function pc(){let x=pr();while(isO('%')){nx();x=['B','/',x,['n',100]]}return x}
 function pr(){const k=nx();if(!k)throw new Error('fim inesperado');
  if(k[0]==='n'||k[0]==='s'||k[0]==='b')return k;if(k[0]==='r')return ref(k[1]);
  if(k[0]==='f'){nx();const a=[];if(!isO(')')){do{a.push(cmp())}while(isO(',')&&nx())}nx();return['F',k[1],a]}
  if(k[0]==='o'&&k[1]==='('){const e=cmp();nx();return e}throw new Error('token inesperado')}

const NA=new Er('#N/A');
function build(cells){const C={};for(const k in cells){const v=cells[k];C[k]=typeof v==='string'&&v[0]==='='?{f:parse(v.slice(1))}:{v}}return C}
function run(C,inp){
 const X=Object.assign({},C),memo={},busy={};for(const k in inp)X[k]={v:inp[k]};
 const num=v=>{if(v instanceof Er)return v;if(v==null||v==='')return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;const n=+String(v).replace(',','.');return isNaN(n)?new Er('#VALUE!'):n};
 const isn=v=>typeof v==='number';
 const cell=(c,r)=>get(colL(c)+r);
 function get(k){if(k in memo)return memo[k];const x=X[k];if(!x)return null;if(!x.f)return x.v===undefined?null:x.v;if(busy[k])return new Er('#REF!');busy[k]=1;let v=ev(x.f);if(v==null)v=0;busy[k]=0;return memo[k]=v}
 const rng=n=>{const o=[];for(let r=n[2];r<=n[4];r++)for(let c=n[1];c<=n[3];c++)o.push(cell(c,r));return o};
 const tru=v=>{if(v instanceof Er)return v;if(typeof v==='string')return v.toUpperCase()==='TRUE'?true:new Er('#VALUE!');return !!num(v)};
 const eq=(a,b)=>{if(a==null)a=typeof b==='string'?'':0;if(b==null)b=typeof a==='string'?'':0;if(typeof a==='string'&&typeof b==='string')return a.toLowerCase()===b.toLowerCase();return a===b};
 const cmpv=(o,a,b)=>{if(a instanceof Er)return a;if(b instanceof Er)return b;
  if(o==='='||o==='<>'){const r=eq(a,b);return o==='='?r:!r}
  if(a==null)a=typeof b==='string'?'':0;if(b==null)b=typeof a==='string'?'':0;
  const ra=typeof a==='string'?1:0,rb=typeof b==='string'?1:0;let d=ra!==rb?ra-rb:(ra?(a.toLowerCase()<b.toLowerCase()?-1:a.toLowerCase()>b.toLowerCase()?1:0):a-b);
  return o==='<'?d<0:o==='>'?d>0:o==='<='?d<=0:d>=0};
 const crit=(cr)=>{let o='=',v=cr;if(typeof cr==='string'){const m=/^(<>|<=|>=|=|<|>)(.*)$/.exec(cr);if(m){o=m[1];v=m[2]}const n=v!==''&&!isNaN(+v)?+v:v;v=n}
  return x=>{if(x instanceof Er)return false;if(typeof v==='number'){const n=typeof x==='number'?x:(typeof x==='string'&&x!==''&&!isNaN(+x)?+x:null);if(n==null)return o==='<>';return o==='='?n===v:o==='<>'?n!==v:o==='<'?n<v:o==='>'?n>v:o==='<='?n<=v:n>=v}
   const s=x==null?'':String(x).toLowerCase(),w=String(v).toLowerCase();return o==='<>'?s!==w:s===w}};
 function ev(n){
  switch(n[0]){
   case'n':case's':case'b':return n[1];
   case'c':return cell(n[1],n[2]);
   case'g':return new Er('#VALUE!');
   case'u':{const v=num(ev(n[1]));return v instanceof Er?v:-v}
   case'B':{const o=n[1];let a=ev(n[2]),b=ev(n[3]);
    if(['=','<>','<','>','<=','>='].includes(o))return cmpv(o,a,b);
    if(o==='&')return a instanceof Er?a:b instanceof Er?b:String(a==null?'':a)+String(b==null?'':b);
    a=num(a);b=num(b);if(a instanceof Er)return a;if(b instanceof Er)return b;
    if(o==='+')return a+b;if(o==='-')return a-b;if(o==='*')return a*b;
    if(o==='/')return b===0?new Er('#DIV/0!'):a/b;return Math.pow(a,b)}
   case'F':return fn(n[1],n[2])}}
 function fn(f,a){
  const flat=(skipText)=>{const o=[];for(const x of a){if(x[0]==='g')o.push(...rng(x));else if(skipText===2&&x[0]==='c')o.push(ev(x));else o.push(ev(x))}return o};
  switch(f){
   case'IF':{const c=tru(ev(a[0]));if(c instanceof Er)return c;return c?ev(a[1]):(a.length>2?ev(a[2]):false)}
   case'IFERROR':{const v=ev(a[0]);return v instanceof Er?ev(a[1]):v}
   case'SUM':case'AVERAGE':case'MAX':case'MIN':{let s=0,k=0,mx=-Infinity,mn=Infinity;for(const x of a){const direct=x[0]!=='g'&&x[0]!=='c';const vs=x[0]==='g'?rng(x):[ev(x)];
     for(const v of vs){if(v instanceof Er)return v;let q=null;if(isn(v))q=v;else if(direct&&v!=null&&v!==''){q=num(v);if(q instanceof Er)return q}else if(typeof v==='boolean'&&direct)q=v?1:0;if(q!=null){s+=q;k++;mx=Math.max(mx,q);mn=Math.min(mn,q)}}}
    return f==='SUM'?s:f==='AVERAGE'?(k?s/k:new Er('#DIV/0!')):f==='MAX'?(k?mx:0):(k?mn:0)}
   case'SUMIF':{const g=a[0],t=crit(ev(a[1])),s=a[2]||a[0],R=rng(g),S=rng(['g',s[1],s[2],s[1]+(g[3]-g[1]),s[2]+(g[4]-g[2])]);let tot=0;R.forEach((v,i)=>{if(t(v)&&isn(S[i]))tot+=S[i]});return tot}
   case'OR':case'AND':{let r=f==='AND';for(const v of flat()){if(v==null||v==='')continue;const b=tru(v);if(b instanceof Er)return b;if(f==='OR'&&b)return true;if(f==='AND'&&!b)return false}return r?true:false}
   case'ROUND':{const v=num(ev(a[0])),d=num(ev(a[1]));if(v instanceof Er)return v;const p=Math.pow(10,d);return Math.sign(v)*Math.round(Math.abs(v)*p+1e-9)/p}
   case'TODAY':return Math.floor((Date.now()-Date.UTC(1899,11,30))/864e5);
   default:return new Er('#NAME?')}}
 return{get,ev:k=>{const v=get(k);return v instanceof Er?v.c:v}}}
return{parse,build,run,colN,colL,Er}})();

const idb=()=>new Promise(r=>{const q=indexedDB.open('cp',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const kget=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result)})};
